version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: renewable-energy-postgres
    environment:
      POSTGRES_USER: renewable_user
      POSTGRES_PASSWORD: renewable_password
      POSTGRES_DB: renewable_energy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renewable_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: renewable-energy-backend
    environment:
      DATABASE_URL: postgresql://renewable_user:renewable_password@postgres:5432/renewable_energy
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: renewable-energy-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  backend_data:
